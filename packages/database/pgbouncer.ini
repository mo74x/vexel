; pgbouncer.ini (Assuming PostgreSQL max_connections = 100)
[databases]
vexel_core = host=vexel-postgres port=5432 dbname=vexel_core

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
auth_type = scram-sha-256
pool_mode = transaction

; Allow up to 400 Prisma client connections across horizontally scaled worker & web containers
max_client_conn = 400

; Multiplex those 400 client connections onto 60 actual PostgreSQL backend processes
default_pool_size = 60
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

; Automatically kill any transaction that stalls for more than 15 seconds
server_idle_timeout = 60
query_wait_timeout = 15
idle_transaction_timeout = 15

; Cleanly ignore startup parameters sent by Prisma/Postgres drivers
ignore_startup_parameters = extra_float_digits,options,search_path

